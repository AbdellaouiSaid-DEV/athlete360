<script>
'use strict';
/* ATHLETE 360 — logique pure : formules, analyses, démo. Aucune dépendance au DOM. */
const CTX = { days: {}, profile: null, today: null };

/* ---------- dates & stats ---------- */
const DOWS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DOW_FR = { Mon: 'Lundi', Tue: 'Mardi', Wed: 'Mercredi', Thu: 'Jeudi', Fri: 'Vendredi', Sat: 'Samedi', Sun: 'Dimanche' };
const DOW_SH = { Mon: 'Lun', Tue: 'Mar', Wed: 'Mer', Thu: 'Jeu', Fri: 'Ven', Sat: 'Sam', Sun: 'Dim' };
const pad = n => (n < 10 ? '0' + n : '' + n);
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const dowOf = s => DOWS[parseISO(s).getDay()];
const datesBack = (end, n) => { const a = []; for (let i = n - 1; i >= 0; i--) a.push(addDays(end, -i)); return a; };
const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 864e5);
const num = x => x != null && x !== '' && !isNaN(x);
const mean = a => { a = a.filter(num); return a.length ? a.reduce((x, y) => x + +y, 0) / a.length : null; };
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const median = a => { a = a.filter(num).map(Number).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
const sd = a => { a = a.filter(num).map(Number); if (a.length < 2) return null; const m = mean(a); return Math.sqrt(sum(a.map(x => (x - m) * (x - m))) / (a.length - 1)); };
function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = mean(xs), my = mean(ys); let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
function slope(pts) { // [[x,y]] -> pente par unité de x
  if (pts.length < 2) return null;
  const mx = mean(pts.map(p => p[0])), my = mean(pts.map(p => p[1])); let sxy = 0, sxx = 0;
  pts.forEach(p => { sxy += (p[0] - mx) * (p[1] - my); sxx += (p[0] - mx) ** 2; });
  return sxx ? sxy / sxx : null;
}
const fmt = (n, d) => (num(n) ? (+n).toFixed(d == null ? 0 : d).replace('.', ',') : '—');
const fmtH = m => (num(m) ? Math.floor(m / 60) + ' h ' + pad(Math.round(m % 60)) : '—');
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- référentiels ---------- */
const MUS = { chest: 'Pectoraux', back: 'Dos', shoulders: 'Épaules', biceps: 'Biceps', triceps: 'Triceps', core: 'Tronc / abdos', quads: 'Quadriceps', hams: 'Ischio-jambiers', glutes: 'Fessiers', calves: 'Mollets' };
const MKEYS = Object.keys(MUS);
const PUSH = ['chest', 'shoulders', 'triceps'], PULL = ['back', 'biceps'];
const ANT = ['chest', 'shoulders', 'quads', 'core'], POST = ['back', 'hams', 'glutes', 'calves'];
// [nom anglais, principal, secondaires, type, séries, répétitions]
const EX = [
  ['Barbell Bench Press', 'chest', ['triceps', 'shoulders'], 'compound', 4, '6-8'],
  ['Dumbbell Bench Press', 'chest', ['triceps', 'shoulders'], 'compound', 3, '8-10'],
  ['Incline Dumbbell Press', 'chest', ['shoulders', 'triceps'], 'compound', 3, '8-10'],
  ['Push-up', 'chest', ['triceps', 'shoulders', 'core'], 'compound', 3, 'max'],
  ['Chest Dip', 'chest', ['triceps', 'shoulders'], 'compound', 3, '8-12'],
  ['Dumbbell Fly', 'chest', [], 'isolation', 3, '12-15'],
  ['Cable Crossover', 'chest', [], 'isolation', 3, '12-15'],
  ['Pull-up', 'back', ['biceps'], 'compound', 4, 'max'],
  ['Chin-up', 'back', ['biceps'], 'compound', 3, 'max'],
  ['Barbell Row', 'back', ['biceps'], 'compound', 4, '8'],

  } else if (t === 'drill') {

    const rows = cats.map(c => { const all = [].concat.apply([], Object.keys(CTX.days).sort().filter(dd => dd <= d).map(dd => (CTX.days[dd].drills || []).filter(r => r.cat === c).map(r => Object.assign({ d: dd }, r)))); if (!all.length) return ''; const vals = all.map(r => r.value).filter(num), low = DRILLS[c].low, best = vals.length ? (low ? Math.min.apply(null, vals) : Math.max.apply(null, vals)) : null, last = all[all.length - 1]; return `<tr><td>${c}</td><td class="n">${all.length}</td><td class="n">${fmt(sum(all.map(r => r.min)))}</td><td class="n">${fmt(last.value)} <span class="note">${dateFr(last.d)}</span></td><td class="n">${fmt(best)} <span class="note">${DRILLS[c].unit}</span></td><td>${all.every(r => r.measured) ? pill('mesuré', 'good') : pill('mixte / estimé', 'warn')}</td></tr>`; }).join('');

/* ---------- E. Marche, cardio ---------- */

<script>
'use strict';
/* Score 360° hebdomadaire (reprend la logique de l'onglet ANALYSE_360 du fichier Excel), retour Android, environnement hors ligne */
HELP.score360 = ['Score 360° hebdomadaire (0–100)', `<p>Reprend la logique de l'onglet ANALYSE_360 de ton fichier Excel. Chaque axe vaut 0 à 100 % de sa cible hebdomadaire (plafonné à 100 %), la semaine va du lundi au dimanche.</p>
<ul><li><b>Musculation</b> : jours d'entraînement ÷ cible (5)</li><li><b>Marche</b> : minutes ÷ (7 × cible quotidienne, 25 min)</li><li><b>Sommeil</b> : durée moyenne ÷ objectif (8 h)</li><li><b>Nutrition</b> : protéines de la semaine ÷ (7 × poids × minimum g/kg)</li><li><b>Mobilité</b> (3 j), <b>Core</b> (3 j, type « Core Stability »), <b>Skills</b> (2 j, agilité / condition)</li><li><b>Récupération</b> : douleur maximale de la semaine (≥ 5 : 0 ; 3–4 : 0,5 ; sinon 1)</li></ul>
<p><b>Score</b> = moyenne des axes renseignés × 100. Un axe sans aucune donnée cette semaine reste vide. <b>Fiabilité</b> : aucun score si moins de 4 axes sont renseignés. Les cibles sont modifiables dans Réglages. Ce score mesure la régularité, pas la qualité ni l'état de santé.</p>`];
const AX360 = [['resist', 'Musculation'], ['walk', 'Marche'], ['sleep', 'Sommeil'], ['nut', 'Nutrition'], ['mob', 'Mobilité'], ['core', 'Core'], ['skills', 'Skills'], ['rec', 'Récupération']];
function score360(mon) {
  const P = prof(), W = P.wk, ds = Array.from({ length: 7 }, (_, i) => addDays(mon, i)), cap = v => Math.min(1, v);
  const X = d => D(d) || {}, ax = {};
  const nT = ds.filter(didTrain).length; ax.resist = nT ? cap(nT / W.resist) : null;
  const wd = ds.filter(d => num((X(d).act || {}).walkMin)); ax.walk = wd.length ? cap(sum(wd.map(d => X(d).act.walkMin)) / (7 * W.walk)) : null;
  const sl = ds.map(d => sleepMin(X(d).sleep)).filter(num); ax.sleep = sl.length ? cap(mean(sl) / 60 / P.sleepTarget) : null;
  const wgt = weightAt(ds[6]), nd = ds.filter(d => nutDay(d).n > 0); ax.nut = nd.length && wgt ? cap(sum(nd.map(d => nutDay(d).p)) / (7 * wgt * P.rules.protMin)) : null;
  const cnt = f => ds.filter(d => (X(d).mob || []).some(f) ).length;
  const mb = cnt(m => m.type !== 'Core Stability' && m.min > 0), cr = cnt(m => m.type === 'Core Stability' && m.min > 0), sk = ds.filter(d => (X(d).drills || []).some(r => r.min > 0)).length;
  ax.mob = mb ? cap(mb / W.mob) : null; ax.core = cr ? cap(cr / W.core) : null; ax.skills = sk ? cap(sk / W.skills) : null;
  const pn = ds.map(d => (X(d).sleep || {}).pain).filter(num); ax.rec = pn.length ? (Math.max.apply(null, pn) >= 5 ? 0 : Math.max.apply(null, pn) >= 3 ? 0.5 : 1) : null;
  const vals = AX360.map(a => ax[a[0]]).filter(v => v != null), score = vals.length >= 4 ? Math.round(100 * mean(vals)) : null;
  let prio = 'Données insuffisantes', act = 'Renseigne au moins 4 axes sur la semaine.', best = null;
  if (score != null) {
    const sa = ax.sleep != null && ax.sleep < 0.85;
    if (ax.rec === 0) { prio = 'Douleur et récupération'; act = 'Réduis la charge et demande un avis médical si la douleur persiste.'; }
    else if (sa) { prio = 'Sommeil'; act = 'Stabilise l’heure du coucher et vise 7–9 h.'; }
    else if (ax.resist != null && ax.resist < 0.8) { prio = 'Régularité des séances'; act = 'Redistribue les séances sans doubler les charges.'; }
    else if (ax.walk != null && ax.walk < 0.8) { prio = 'Marche'; act = 'Ajoute 5 minutes de marche, progressivement.'; }
    else { prio = 'Maintenir l’équilibre'; act = 'Continue et n’augmente qu’un seul objectif à la fois.'; }
    let bk = null; AX360.forEach(a => { if (ax[a[0]] != null && (bk == null || ax[a[0]] > ax[bk])) bk = a[0]; }); best = bk ? AX360.find(a => a[0] === bk)[1] : null;
  }
  return { ax, score, n: vals.length, prio, act, best, mon };
}
function panel360(d) {
  const P = prof(), mon = mondayOf(d), r = score360(mon);
  const hist = Array.from({ length: 8 }, (_, i) => score360(addDays(mon, -7 * (7 - i))));
  const left = P.deadline ? diffDays(P.deadline, d) : null;
  const axes = AX360.map(a => { const v = r.ax[a[0]]; return `<div class="item"><div style="flex:1"><div class="row sp"><span>${a[1]}</span><b>${v != null ? fmt(v * 100) + ' %' : '—'}</b></div>${bar(v != null ? v * 100 : null)}</div></div>`; }).join('');
  return panel('Score 360° — semaine du ' + dateFr(mon), `<div class="grid g2"><div>${kpi('Score de la semaine', r.score != null ? r.score + '<small>/100</small>' : '—', r.score != null ? `${r.n}/8 axes renseignés · priorité : ${esc(r.prio)}` : 'Moins de 4 axes renseignés : pas de score', { bar: r.score })}${r.score != null ? `<div class="alert info" style="margin-top:8px"><div><b>Action suggérée</b>${esc(r.act)}${r.best ? ' Point fort : ' + esc(r.best) + '.' : ''}</div></div>` : ''}${left != null ? `<p class="note" style="margin-top:8px">Échéance de l'objectif physique : ${dateFr(P.deadline)} · ${left > 0 ? left + ' jours (' + Math.ceil(left / 7) + ' semaines)' : 'échéance atteinte'}.</p>` : ''}</div><div class="list">${axes}</div></div>${chartBars(hist.map((h, i) => ({ label: i === 7 ? 'S0' : 'S-' + (7 - i), v: h.score })), { label: 'Score 360° des 8 dernières semaines', hl: [{ y: 70, label: 'repère' }] })}`, helpBtn('score360'));
}
/* retour Android : fermer la fenêtre, puis revenir à l'accueil, sinon laisser l'application se fermer */
window.__back = function () {
  if (S.ui.modal) { S.ui.modal = null; render(); return true; }
  if (S.ui.page !== 'cc') { S.ui.page = 'cc'; render(); return true; }
  return false;
};

    panel('Préparation à l’entraînement', rdHtml, helpBtn('readiness')) +

/* ---------- J. Objectifs ---------- */

/* ---------- L. Rapports ---------- */
function pgRep() {
  const d = S.ui.date, per = S.ui.repPeriod, N = { day: 1, week: 7, month: 30, quarter: 90, year: 365 }[per], P = prof();
  const cur = windowStats(d, N), prev = windowStats(addDays(d, -N), N), an = analyze(d);
  const M = [['Séances', 'sessions', 0, ''], ['Séries de travail', 'sets', 0, ''], ['Tonnage', 'tonnage', 0, ' kg'], ['Adhérence', 'adh', 0, ' %'], ['Sommeil moyen', 'sleepH', 2, ' h'], ['Préparation moyenne', 'readiness', 0, '/100'], ['Énergie moyenne', 'kcal', 0, ' kcal'], ['Protéines moyennes', 'prot', 0, ' g'], ['Protéines (g/kg)', 'pkg', 2, ''], ['Pas moyens', 'steps', 0, ''], ['Eau moyenne', 'water', 0, ' ml'], ['Mobilité (total)', 'mobMin', 0, ' min'], ['Agilité (total)', 'drillMin', 0, ' min'], ['Poids moyen', 'weight', 1, ' kg']];
  const nOf = { sleepH: cur.nights + ' nuits', readiness: cur.checkins + ' check-ins', kcal: cur.nutDays + ' j saisis', prot: cur.nutDays + ' j', pkg: cur.nutDays + ' j', steps: cur.stepsDays + ' j', weight: cur.nW + ' pesées' };
  const rows = M.map(m => { const c = cur[m[1]], p = prev[m[1]]; return `<tr><td>${m[0]}</td><td class="n">${c != null && !isNaN(c) ? fmt(c, m[2]) + m[3] : '—'}</td><td class="n">${p != null && !isNaN(p) ? fmt(p, m[2]) + m[3] : '—'}</td><td class="n">${c != null && p != null && !isNaN(c) && !isNaN(p) ? signed(c - p, m[2]) : '—'}</td><td class="note">${nOf[m[1]] || ''}</td></tr>`; }).join('');
  const dayRep = () => {
    const x = D(d) || {}, nd = nutDay(d), nt = nutTargets(d), gaps = [], s = x.sleep || {}, sg = stepGoal(d);
    if (nt && nd.n && Math.abs(nd.kcal - nt.kcal) / nt.kcal > 0.15) gaps.push(`Énergie ${fmt(nd.kcal)} kcal pour une cible de ${fmt(nt.kcal)} kcal`);

    if (sleepMin(s) != null && sleepMin(s) < P.sleepTarget * 60 - 60) gaps.push(`Sommeil ${fmtH(sleepMin(s))}, plus d'1 h sous l'objectif`);
    if (num((x.act || {}).steps) && x.act.steps < sg.goal * 0.6) gaps.push(`Pas ${fmt(x.act.steps)}, moins de 60 % de l'objectif`);
    if (nd.water && nd.water < P.waterTarget * 0.6) gaps.push(`Eau ${fmt(nd.water)} ml, moins de 60 % de l'objectif`);
    return panel('Rapport quotidien — ' + dateLong(d), `<div class="grid g2"><div><h3>Activités</h3><ul>${wrk(d).map(w => `<li>${esc(w.name)} : ${(w.exercises || []).filter(e => workSets(e).length).length} exercices, ${sum((w.exercises || []).map(e => workSets(e).length))} séries${w.durMin ? ', ' + w.durMin + ' min' : ''}</li>`).join('')}${(x.mob || []).map(m => `<li>${esc(m.type)} ${fmt(m.min)} min</li>`).join('')}${(x.drills || []).map(m => `<li>${esc(m.cat)} ${fmt(m.min)} min</li>`).join('')}${num((x.act || {}).steps) ? `<li>${fmt(x.act.steps)} pas</li>` : ''}</ul>${!wrk(d).length && !(x.mob || []).length && !(x.drills || []).length && !num((x.act || {}).steps) ? '<p class="note">Aucune activité enregistrée.</p>' : ''}</div><div><h3>Nutrition, sommeil, récupération</h3><ul><li>Nutrition : ${nd.n ? `${fmt(nd.kcal)} kcal, P ${fmt(nd.p)} g, G ${fmt(nd.c)} g, L ${fmt(nd.f)} g, eau ${fmt(nd.water)} ml` : 'non saisie'}</li><li>Sommeil : ${sleepMin(s) != null ? fmtH(sleepMin(s)) + (s.quality ? ', qualité ' + s.quality + '/5' : '') : 'non saisi'}</li><li>Préparation : ${readiness(d).score != null ? fmt(readiness(d).score) + '/100 (fiabilité ' + readiness(d).rel.toLowerCase() + ')' : 'non calculable'}</li></ul></div></div><h3 style="margin-top:12px">Écarts majeurs</h3>${gaps.length ? `<ul>${gaps.map(g => `<li>${esc(g)}</li>`).join('')}</ul>` : '<p class="note">Aucun écart majeur détecté sur les données saisies.</p>'}`);

    case 'addConsult': { const v = formVals(el).o; if (!v.date) { toast('Date requise'); break; } ensureLabs().consults.push({ id: uid(), date: v.date, who: v.who, note: v.note }); touch('labs'); render(); break; }
    case 'addFollow': { const v = formVals(el).o; if (!v.date || !v.label) { toast('Intitulé et date requis'); break; } ensureLabs().follow.push({ id: uid(), label: v.label, date: v.date }); touch('labs'); render(); break; }
    case 'addCmeas': { const v = formVals(el).o; if (!(v.name || '').trim()) break; const pr = ensureProfile(); pr.customMeasures = pr.customMeasures || []; pr.customMeasures.push({ id: uid(), name: v.name.trim(), unit: v.unit }); touch('profile'); render(); break; }
    case 'addGoal': {
      const pr = ensureProfile(), pre = dt.p === '' ? null : GOAL_PRESETS[+dt.p], g = Object.assign({ id: uid(), name: 'Nouvel objectif', cat: '', horizon: 'monthly', metric: 'manual', start: null, target: null, unit: '', date: '', risks: '', hist: [], created: S.ui.date }, pre || {});
      if (pre) { const c = goalCurrent(g, S.ui.date); if (c != null) g.start = c; } pr.goals.push(g); touch('profile'); render(); break;
    }
    case 'archGoal': { const pr = ensureProfile(); pr.goals[+dt.i].archived = !pr.goals[+dt.i].archived; touch('profile'); render(); break; }

    case 'exportJSON': saveFile('athlete360-sauvegarde.json', JSON.stringify({ app: 'athlete360', v: 1, exported: new Date().toISOString(), docs: S.docs }, null, 1)); break;

}
function csvImport() {
  const c = S.ui.csv; if (!c || !c.rows) return; const fs = CSV_FIELDS[c.kind]; const miss = fs.filter(f => f[2] && (c.map[f[0]] === '' || c.map[f[0]] == null)); if (miss.length) { toast('Associez : ' + miss.map(m => m[1]).join(', ')); return; }
  const g = (r, k) => (c.map[k] === '' || c.map[k] == null ? '' : r[+c.map[k]]); let added = 0, skipped = 0, unknown = new Set();
  if (c.kind === 'weight') {
    c.rows.slice(1).forEach(r => { const d = parseDateAny(g(r, 'date')), w = nv(String(g(r, 'weight')).replace(',', '.')); if (!d || w == null) { skipped++; return; } const doc = ensureDay(d); doc.meas = doc.meas || {}; if (doc.meas.weight != null) { skipped++; return; } doc.meas.weight = w; doc.meas.src = 'import-csv'; const bf = nv(String(g(r, 'bf')).replace(',', '.')); if (bf != null && doc.meas.bf == null) { doc.meas.bf = bf; doc.meas.bfSrc = 'impédancemétrie (balance)'; } touch('d_' + d); added++; });
  } else {
    const have = {}; Object.keys(DM()).forEach(k => { if (k.indexOf('d_') !== 0) return; ((DM()[k].workouts) || []).forEach(w => (w.exercises || []).forEach(ex => (ex.sets || []).forEach(s => { const kk = k + '|' + ex.name.toLowerCase() + '|' + (s.kg || 0) + '|' + s.reps; have[kk] = (have[kk] || 0) + 1; }))); });
    const lib = {}; EX.forEach(e => { lib[e[0].toLowerCase()] = e[0]; });
    c.rows.slice(1).forEach(r => {
      const d = parseDateAny(g(r, 'date')), nm = String(g(r, 'exercise')).trim(), reps = nv(g(r, 'reps')), kg = nv(String(g(r, 'kg')).replace(',', '.')) || 0; if (!d || !nm || !reps) { skipped++; return; }
      const name = lib[nm.toLowerCase()] || nm, kk = 'd_' + d + '|' + name.toLowerCase() + '|' + kg + '|' + reps; if (have[kk] > 0) { have[kk]--; skipped++; return; }
      const doc = ensureDay(d); doc.workouts = doc.workouts || []; let w = doc.workouts.find(x => x.src === 'import-csv'); if (!w) { w = { id: uid(), name: 'Import CSV', done: true, exercises: [], src: 'import-csv' }; doc.workouts.push(w); }
      let ex = w.exercises.find(x => x.name === name); if (!ex) { ex = lib[nm.toLowerCase()] ? exObj(name) : { name, p: null, s: [], type: 'compound', plan: { sets: 0, reps: '' }, sets: [] }; ex.sets = []; if (!lib[nm.toLowerCase()]) unknown.add(nm); w.exercises.push(ex); }
      const st = { kg, reps }; const rpe = nv(g(r, 'rpe')), rir = nv(g(r, 'rir')); if (rpe != null) st.rpe = rpe; if (rir != null) st.rir = rir; ex.sets.push(st); touch('d_' + d); added++;

  }
  S.ui.csv = null; render(); toast(`${added} ligne(s) importée(s), ${skipped} ignorée(s) (doublons ou invalides)` + (unknown.size ? ` ; ${unknown.size} exercice(s) non reconnu(s) : non comptés dans le volume par muscle` : ''));
}
async function wipeAll() {
  if (S.ui.wipe !== 'SUPPRIMER') { toast('Tapez SUPPRIMER pour confirmer'); return; }
  const ids = Object.keys(S.docs);
  if (S.localOnly) { ids.forEach(id => { try { localStorage.removeItem('a360.' + id); } catch (e) { } }); }
  else { for (const id of ids) { try { await S.col.doc(id).delete(); } catch (e) { toast('Suppression incomplète : ' + (e && e.code || '')); break; } } }
  S.docs = {}; S.last = {}; S.dirty.clear(); S.ui.wipe = ''; render(); toast('Données supprimées');
}
function onFile(el) {
  const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => {
    const text = String(rd.result || '');
    if (el.dataset.file === 'csv') { const rows = parseCSV(text); if (rows.length < 2) { toast('Fichier vide ou illisible'); return; } const kind = (S.ui.csv && S.ui.csv.kind) || 'workouts', map = {}, hdr = rows[0].map(h => h.toLowerCase()); const guess = { date: ['date'], exercise: ['exercise', 'exercice', 'name'], reps: ['reps', 'répétitions', 'repetitions'], kg: ['weight', 'kg', 'charge', 'poids'], rpe: ['rpe'], rir: ['rir'], weight: ['weight', 'poids', 'weight (kg)'], bf: ['body fat', 'bodyfat', 'fat', 'masse grasse'] }; CSV_FIELDS[kind].forEach(fl => { const i = hdr.findIndex(h => (guess[fl[0]] || []).some(x => h.indexOf(x) >= 0)); map[fl[0]] = i >= 0 ? i : ''; }); S.ui.csv = { kind, rows, map }; render(); }
    else if (el.dataset.file === 'json') {
      try { const o = JSON.parse(text); if (!o || o.app !== 'athlete360' || !o.docs) throw new Error('format'); let a = 0; Object.keys(o.docs).forEach(id => { if (!/^(d_\d{4}-\d\d-\d\d|profile|labs|supps)$/.test(id)) return; if (!S.docs[id]) { S.docs[id] = o.docs[id]; touch(id); a++; } }); render(); toast(a + ' document(s) restauré(s) ; les données existantes sont conservées'); } catch (e) { toast('Fichier de sauvegarde invalide'); }
    }
  };
  rd.readAsText(f);
}

/* ---------- événements ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closeModal' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  act(el.dataset.act, el);
});
document.addEventListener('change', e => {
  const el = e.target; if (!el || !el.dataset) return;
  if (el.id === 'datepick') { if (el.value) { S.ui.date = el.value; render(); } return; }
  if (el.dataset.file) { onFile(el); return; }
  if (el.dataset.actChange) {
    const a = el.dataset.actChange;
    if (a === 'pickEx') { S.ui.liftEx = el.value; render(); } else if (a === 'labParam') { S.ui.labParam = el.value; render(); }
    else if (a === 'csvKind') { S.ui.csv = null; S.ui.csvKind = el.value; render(); const sel_ = document.querySelector('[data-act-change="csvKind"]'); if (sel_) sel_.value = el.value; }
    else if (a === 'csvMap') { S.ui.csv.map[el.dataset.k] = el.value; renderKeep(); }
    return;
  }
  if (el.dataset.p) applyBinding(el);
});
document.addEventListener('input', e => { if (e.target && e.target.dataset && e.target.dataset.wipe) S.ui.wipe = e.target.value; });

/* première ouverture hors ligne : crée le profil et les compléments à partir des paramètres de départ */
function firstRun() {
  if (typeof A360_SEED === 'undefined' || localStorage.getItem('a360.seeded')) return;
  try { if (!S.docs.profile) { S.docs.profile = clone(mergeProfile(null)); touch('profile'); } if (!S.docs.supps) { S.docs.supps = { items: clone(A360_SEED.supps || []) }; touch('supps'); } localStorage.setItem('a360.seeded', '1'); } catch (e) { }
}
/* ---------- démarrage ---------- */
async function boot() {
  applyTheme(); render(); setSave('idle');
  let ok = false;
  try {
    if (window.claude && window.claude.use) {
      const user = await window.claude.use('user'), id = user ? await user.id() : null, db = id ? await window.claude.use('db') : null;
      if (db && id) {
        S.db = db; S.uid = id; S.col = db.collection('data/users/' + id);
        S.col.limit(1000).onSnapshot(onSnap, err => { setSave('err', err && err.code); S.loaded = true; });
        ok = true;
      }
    }
  } catch (e) { ok = false; }
  if (!ok) { S.localOnly = true; lsLoad(); firstRun(); S.loaded = true; renderKeep(); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { } }
}
boot();
